repos:
  - repo: local
    hooks:
      - id: lint
        name: zsh -n и shellcheck
        entry: make lint
        language: system
        pass_filenames: false
        files: '(\.(zsh|sh|bash)|^ask/agterm-ask(-mcp)?)$'
      - id: bats
        name: bats
        entry: make test
        language: system
        pass_filenames: false
        files: '^(wt/|ask/|tests/|install\.sh$)'
