repos:
  - repo: local
    hooks:
      - id: lint
        name: zsh -n и shellcheck
        entry: make lint
        language: system
        pass_filenames: false
        files: '(\.(zsh|sh|bash|py|html)|^ask/agterm-ask(-mcp)?|^wt/agterm-worktrees)$'
      - id: bats
        name: bats
        entry: make test
        language: system
        pass_filenames: false
        files: '^(wt/|ask/|workflows/|tests/|install\.sh$)'
